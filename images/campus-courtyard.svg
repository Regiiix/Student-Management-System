    <circle cx="189" cy="535" r="38" fill="#4f9276"/>
    <rect x="1400" y="558" width="18" height="86" fill="#5a7f73"/>
    <circle cx="1409" cy="534" r="37" fill="#4f9276"/>

    <rect x="126" y="590" width="14" height="62" fill="#5a7f73"/>
    <circle cx="133" cy="573" r="27" fill="#5c9d80"/>
    <rect x="1462" y="590" width="14" height="62" fill="#5a7f73"/>
    <circle cx="1469" cy="573" r="27" fill="#5c9d80"/>
  </g>
</svg>
