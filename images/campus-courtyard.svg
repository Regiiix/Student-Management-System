<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Campus Courtyard</title>
  <desc id="desc">Illustration of a school building and courtyard at daylight.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd9e8"/>
      <stop offset="1" stop-color="#f2f7fa"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec1aa"/>
      <stop offset="1" stop-color="#5a9a84"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#d5e2ea"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#145d95"/>
      <stop offset="1" stop-color="#0f6d6a"/>
    </linearGradient>
    <linearGradient id="walkway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8eedf"/>
      <stop offset="1" stop-color="#e4ccb0"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f4fa"/>
      <stop offset="1" stop-color="#bdd9e6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <circle cx="1380" cy="120" r="70" fill="#ffe19f" opacity="0.9"/>

  <path d="M0 470 C220 420 360 500 540 468 C760 430 900 360 1120 390 C1300 414 1450 430 1600 412 L1600 900 L0 900 Z" fill="#dfeef1"/>
  <rect x="0" y="600" width="1600" height="300" fill="url(#lawn)"/>

  <path d="M680 900 L920 900 L980 600 L620 600 Z" fill="url(#walkway)"/>
  <path d="M742 900 L858 900 L890 600 L710 600 Z" fill="#efe0cc" opacity="0.65"/>

  <polygon points="320,340 800,170 1280,340" fill="url(#roof)"/>
  <rect x="360" y="334" width="880" height="320" rx="22" fill="url(#building)" stroke="#b6c9d3" stroke-width="5"/>

  <rect x="730" y="474" width="140" height="180" rx="10" fill="#1f5e84"/>
  <circle cx="850" cy="565" r="8" fill="#d6e5ec"/>

  <g stroke="#b4c8d2" stroke-width="3" fill="url(#window)">
    <rect x="430" y="390" width="130" height="95" rx="10"/>
    <rect x="620" y="390" width="130" height="95" rx="10"/>
    <rect x="850" y="390" width="130" height="95" rx="10"/>
    <rect x="1040" y="390" width="130" height="95" rx="10"/>

    <rect x="430" y="516" width="130" height="95" rx="10"/>
    <rect x="620" y="516" width="130" height="95" rx="10"/>
    <rect x="850" y="516" width="130" height="95" rx="10"/>
    <rect x="1040" y="516" width="130" height="95" rx="10"/>
  </g>

  <g stroke="#b4c8d2" stroke-width="2">
    <line x1="495" y1="390" x2="495" y2="485"/>
    <line x1="685" y1="390" x2="685" y2="485"/>
    <line x1="915" y1="390" x2="915" y2="485"/>
    <line x1="1105" y1="390" x2="1105" y2="485"/>

    <line x1="495" y1="516" x2="495" y2="611"/>
    <line x1="685" y1="516" x2="685" y2="611"/>
    <line x1="915" y1="516" x2="915" y2="611"/>
    <line x1="1105" y1="516" x2="1105" y2="611"/>

    <line x1="430" y1="438" x2="560" y2="438"/>
    <line x1="620" y1="438" x2="750" y2="438"/>
    <line x1="850" y1="438" x2="980" y2="438"/>
    <line x1="1040" y1="438" x2="1170" y2="438"/>

    <line x1="430" y1="564" x2="560" y2="564"/>
    <line x1="620" y1="564" x2="750" y2="564"/>
    <line x1="850" y1="564" x2="980" y2="564"/>
    <line x1="1040" y1="564" x2="1170" y2="564"/>
